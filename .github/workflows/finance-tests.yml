name: TAXI TIME Finance Tests
on:
  push:
    paths:
      - 'finance/**'
      - '.github/workflows/finance-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run finance calculation tests
        run: node finance/finance.test.mjs
