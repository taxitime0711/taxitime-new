name: TaxiTimeIOS
options:
  bundleIdPrefix: az.taxitime
  deploymentTarget:
    iOS: '16.0'
targets:
  TaxiTimeIOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.taxitime.ios
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
