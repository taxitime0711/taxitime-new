<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAXI TIME Admin Panel</title>
<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
  <div class="brand"><h2>🚖 TAXI TIME</h2><p>Administrator Panel</p></div>
  <nav>
    <button class="nav-btn active" data-page="company">🏢 Şirkət</button>
    <button class="nav-btn" data-page="prices">💰 Qiymətlər</button>
    <button class="nav-btn" data-page="services">🛠 Xidmətlər</button>
    <button class="nav-btn" data-page="cars">🚗 Avtopark</button>
    <button class="nav-btn" data-page="gallery">🖼️ Qalereya</button>
    <button class="nav-btn" data-page="reviews">⭐ Rəylər</button>
    <button class="nav-btn" data-page="settings">⚙️ Parametrlər</button>
  </nav>
</aside>
<main class="content">
<header class="topbar"><div><h1>TAXI TIME ADMIN PANEL</h1><small>GitHub Connected</small></div></header>

<section id="company" class="page active-page">
  <div class="card">
    <h2>🏢 Şirkət Məlumatları</h2>
    <input id="companyName" placeholder="Şirkət adı">
    <input id="city" placeholder="Şəhər">
    <input id="phone" placeholder="Telefon">
    <input id="whatsapp" placeholder="WhatsApp">
    <div class="actions"><button class="save" onclick="saveData()">💾 Yadda saxla</button></div>
  </div>
</section>

<section id="prices" class="page">
  <div class="card">
    <h2>💰 Quba → Bakı</h2>
    <div class="price-grid">
      <div><label>Tək gediş</label><input id="qubaBakiOneWay" placeholder="Məsələn: 60 AZN"></div>
      <div><label>Gediş-dönüş</label><input id="qubaBakiRoundTrip" placeholder="Məsələn: 100 AZN"></div>
    </div>
    <div class="actions"><button class="save" onclick="saveData()">💾 Yadda saxla</button></div>
  </div>

  <div class="card">
    <h2>💰 Bakı → Quba</h2>
    <div class="price-grid">
      <div><label>Tək gediş</label><input id="bakiQubaOneWay" placeholder="Məsələn: 60 AZN"></div>
      <div><label>Gediş-dönüş</label><input id="bakiQubaRoundTrip" placeholder="Məsələn: 100 AZN"></div>
    </div>
    <div class="actions"><button class="save" onclick="saveData()">💾 Yadda saxla</button></div>
  </div>

  <div class="card">
    <h2>🌍 Rayon Qiymətləri</h2>
    <div class="region-editor">
      <select id="regionSelect" onchange="selectRegion()"></select>
      <input id="regionOneWayInput" placeholder="Tək gediş qiyməti">
      <input id="regionRoundTripInput" placeholder="Gediş-dönüş qiyməti">
      <button class="save" onclick="saveSelectedRegion()">💾 Yadda saxla</button>
      <button class="add" onclick="addRegion()">➕ Əlavə et</button>
      <button class="delete" onclick="deleteSelectedRegion()">🗑️ Sil</button>
    </div>
  </div>
</section>

<section id="services" class="page">
  <div class="card"><h2>🛠 Xidmətlər</h2><div id="servicesList"></div><div class="actions"><button class="add" onclick="addService()">➕ Əlavə et</button><button class="save" onclick="saveData()">💾 Yadda saxla</button></div></div>
</section>
<section id="cars" class="page">
  <div class="card"><h2>🚗 Avtomobillər</h2><div id="carsList"></div><div class="actions"><button class="add" onclick="addCar()">➕ Əlavə et</button><button class="save" onclick="saveData()">💾 Yadda saxla</button></div></div>
</section>
<section id="gallery" class="page">
  <div class="card"><h2>🖼️ Qalereya</h2><div id="galleryList"></div><div class="actions"><button class="add" onclick="addGallery()">➕ Əlavə et</button><button class="save" onclick="saveData()">💾 Yadda saxla</button></div></div>
</section>
<section id="reviews" class="page">
  <div class="card"><h2>⭐ Müştəri Rəyləri</h2><div id="reviewsList"></div><div class="actions"><button class="add" onclick="addReview()">➕ Əlavə et</button><button class="save" onclick="saveData()">💾 Yadda saxla</button></div></div>
</section>
<section id="settings" class="page">
  <div class="card"><h2>⚙️ Parametrlər</h2><p>Parametrlər bölməsi.</p><div class="actions"><button class="save" onclick="saveData()">💾 Yadda saxla</button></div></div>
</section>
</main>
</div>
<script src="admin.js"></script>
</body>
</html>
